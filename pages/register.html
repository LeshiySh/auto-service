<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Регистрация</title>
</head>

<body>
    <div class="container">
        <header>
            <div class="header">
                <div>
                    <a href="../index.html">Sh·auto</a>
                </div>
                <button class="burger">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <nav>
                    <a href="../index.html">Главная</a>
                    <a href="../pages/catalog.html">Каталог</a>
                    <a href="../pages/login.html">Войти</a>
                    <a href="../pages/register.html">Регистрация</a>
                </nav>
            </div>
        </header>
        <main>
            <div class="auth-container">
                <div class="auth">
                    <h1>Регистрация</h1>
                    <form class="auth-form" id="regForm" novalidate>
                        <div class="form-group">
                            <label for="fio">ФИО</label>
                            <input type="text" name="fio" placeholder="ФИО">
                            <small class="field-error" id="err-fio"></small>
                        </div>
                        <div class="form-group">
                            <label for="fio">Логин</label>
                            <input type="text" name="login" placeholder="Логин">
                            <small class="field-error" id="err-login"></small>
                        </div>
                        <div class="form-group">
                            <label for="fio">Email</label>
                            <input type="email" name="email" placeholder="Email">
                            <small class="field-error" id="err-email"></small>
                        </div>
                        <div class="form-group">
                            <label for="fio">Пароль</label>
                            <input type="password" name="password" placeholder="Пароль">
                            <small class="field-error" id="err-password"></small>
                        </div>
                        <div class="form-group">
                            <label for="fio">Повторите пароль</label>
                            <input type="password" name="confirm" placeholder="Повторите пароль">
                            <small class="field-error" id="err-confirm"></small>
                        </div>
                        <button type="submit">Зарегистрироваться</button>
                        <p class="form-success" id="SuccessMessenge">Успешная регистрация</p>
                        <a href="../pages/login.html">Уже зарегистрированы?</a>
                    </form>
                </div>
            </div>
        </main>
        <footer>

        </footer>
    </div>
    <script src="../scripts/burger.js"></script>
    <script src="../scripts/register.js"></script>
</body>

</html>
